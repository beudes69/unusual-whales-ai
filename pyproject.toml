[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "okx-ai-pro"
version = "0.1.0"
description = "Assistant local d'aide à la décision pour les Futures OKX"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "OKX AI PRO contributors" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.2",
    "websockets>=17.0.1",
]

[project.scripts]
okx-ai-pro = "okx_ai_pro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
okx_ai_pro = ["default.toml", "py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["okx_ai_pro"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "B",
    "C4",
    "DTZ",
    "E",
    "F",
    "I",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PTH",
    "RUF",
    "SIM",
    "T20",
    "UP",
    "W",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN201"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]
